<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<title>Periods Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Outfit:wght@600;900&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #89b4fa;
  --primary-glow: rgba(137, 180, 250, 0.3);
  --danger: #f38ba8;
  --warning: #f9e2af;
  --success: #a6e3a1;
  --bg: #1e1e2e;
  --card-bg: rgba(49, 50, 68, 0.7);
  --text: #cdd6f4;
  --text-dim: #a6adc8;
  --divider: #45475a;
  --font-main: 'Inter', system-ui, sans-serif;
  --font-display: 'Outfit', sans-serif;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font-main);
  background: var(--bg);
  color: var(--text);
  padding: 16px;
  line-height: 1.5;
  min-height: 100vh;
  overflow-x: hidden;
}

.glass-bg {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: radial-gradient(circle at 50% 0%, #313244 0%, #1e1e2e 100%);
  z-index: -1;
}

h1, h2, h3 { font-family: var(--font-display); font-weight: 600; }
h1 { font-size: 1.5rem; margin-bottom: 16px; display: flex; align-items: center; gap: 10px; }
h2 { font-size: 1.1rem; margin-bottom: 12px; color: var(--primary); }
h3 { font-size: 0.95rem; margin-bottom: 8px; }

/* Tabs */
.tabs {
  display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap;
  background: var(--card-bg); padding: 6px; border-radius: 14px;
  border: 1px solid var(--divider); backdrop-filter: blur(8px);
}
.tab-btn {
  flex: 1; min-width: 90px; padding: 10px 14px; border-radius: 10px;
  cursor: pointer; border: none; background: transparent;
  color: var(--text-dim); font-family: inherit; font-size: 0.85rem;
  font-weight: 600; transition: all 0.2s;
}
.tab-btn.active {
  background: var(--primary); color: #1e1e2e;
  box-shadow: 0 0 16px var(--primary-glow);
}
.tab-btn:hover:not(.active) { background: rgba(255,255,255,0.05); color: var(--text); }

.tab-panel { display: none; animation: fadeIn 0.25s ease; }
.tab-panel.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

/* Cards */
.card {
  background: var(--card-bg); backdrop-filter: blur(12px);
  border: 1px solid var(--divider); border-radius: 16px;
  padding: 16px; margin-bottom: 12px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.25);
}

/* Date selector */
.date-selector {
  display: flex; gap: 6px; align-items: center; margin-bottom: 16px;
  flex-wrap: wrap; padding: 10px 14px; border-radius: 14px;
  background: var(--card-bg); border: 1px solid var(--divider);
}
.date-btn {
  padding: 6px 14px; border-radius: 8px; cursor: pointer;
  border: 1px solid var(--divider); background: rgba(0,0,0,0.2);
  color: var(--text); font-size: 0.82rem; font-weight: 600; transition: all 0.15s;
  font-family: inherit;
}
.date-btn.active { background: var(--primary); color: #1e1e2e; border-color: var(--primary); }
.date-label { font-size: 0.82rem; color: var(--text-dim); margin-left: auto; }

input[type="text"], input[type="time"], input[type="date"], input[type="search"], select {
  padding: 8px 12px; border-radius: 10px;
  border: 1px solid var(--divider);
  background: rgba(0,0,0,0.25); color: var(--text);
  font-family: inherit; font-size: 0.9rem;
}
input[type="search"] { width: 100%; }
.form-row { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
.form-row label { min-width: 70px; font-weight: 600; font-size: 0.85rem; color: var(--text-dim); }

/* Buttons */
.btn {
  padding: 8px 16px; border-radius: 10px; border: 1px solid var(--divider);
  background: var(--card-bg); color: var(--text);
  cursor: pointer; font-family: inherit; font-weight: 600; font-size: 0.85rem;
  transition: all 0.15s; display: inline-flex; align-items: center; gap: 6px;
}
.btn:hover { background: rgba(255,255,255,0.08); }
.btn-primary { background: var(--primary); color: #1e1e2e; border-color: var(--primary); }
.btn-primary:hover { filter: brightness(1.05); }
.btn-success { background: var(--success); color: #1e1e2e; border-color: var(--success); }
.btn-danger { color: var(--danger); border-color: var(--danger); }
.btn-danger:hover { background: var(--danger); color: #1e1e2e; }
.btn-sm { padding: 4px 10px; font-size: 0.78rem; }
.btn-icon { padding: 6px; min-width: 32px; justify-content: center; }
.btn-ghost { background: none; border: none; color: var(--text-dim); }

/* Timeline */
.timeline-sticky {
  position: sticky; top: 0; z-index: 50;
  background: linear-gradient(to bottom, var(--bg) 70%, transparent);
  padding-bottom: 8px; margin-bottom: 8px;
}
.timeline {
  position: relative; height: 56px; border-radius: 12px;
  background: rgba(0,0,0,0.25); border: 1px solid var(--divider);
  overflow: hidden;
}
.timeline-block {
  position: absolute; top: 4px; bottom: 4px; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.65rem; font-weight: 700; overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap; padding: 0 4px;
  cursor: pointer; transition: filter 0.2s; color: #1e1e2e;
}
.timeline-block:hover { filter: brightness(1.15); }
.timeline-block.is-current { box-shadow: 0 0 12px var(--primary-glow); outline: 2px solid #fff5; }
.timeline-now {
  position: absolute; top: 0; bottom: 0; width: 2px;
  background: var(--success); z-index: 5;
}
.timeline-labels {
  display: flex; justify-content: space-between;
  font-size: 0.7rem; color: var(--text-dim); margin-top: 4px;
}

/* Daily scroll sections */
.daily-scroll { max-height: calc(100vh - 220px); overflow-y: auto; padding-right: 4px; }

.period-section {
  border-left: 4px solid var(--divider);
  padding-left: 12px; margin-bottom: 20px;
  transition: border-color 0.2s;
}
.period-section.is-current {
  border-left-color: var(--success);
}
.period-section.is-past { opacity: 0.75; }
.period-section.is-future { opacity: 0.9; }

.period-header {
  display: flex; justify-content: space-between; align-items: flex-start;
  margin-bottom: 10px; gap: 8px;
}
.period-time-badge {
  font-size: 0.8rem; font-weight: 700; color: var(--primary);
  background: rgba(137,180,250,0.12); padding: 4px 10px; border-radius: 8px;
}
.period-title-row { font-weight: 700; font-size: 1rem; margin-bottom: 4px; }

.break-message {
  text-align: center; padding: 32px 20px; margin: 24px 0;
  border: 2px dashed var(--divider); border-radius: 16px;
  color: var(--text-dim); background: rgba(0,0,0,0.15);
}
.break-message .icon { font-size: 2rem; margin-bottom: 8px; }

/* Task rows in daily view */
.daily-task-row {
  --step-color: var(--primary);
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px; border-radius: 12px;
  background: var(--card-bg); border: 1px solid var(--divider);
  margin-bottom: 6px; transition: all 0.2s;
}
.daily-task-row:hover {
  border-color: var(--step-color);
  box-shadow: 0 0 10px color-mix(in srgb, var(--step-color) 30%, transparent);
}
.daily-task-row.is-done { opacity: 0.5; }
.daily-task-row.is-subtask { margin-left: 16px; border-left: 2px solid var(--divider); }
.daily-task-row.is-running {
  border-left: 4px solid var(--step-color);
  background: color-mix(in srgb, var(--step-color) 10%, transparent);
}

.task-info { flex: 1; min-width: 0; }
.task-title-text {
  font-weight: 600; font-size: 0.9rem;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.task-project-label {
  font-size: 0.72rem; color: var(--text-dim);
  display: flex; align-items: center; gap: 5px; margin-top: 2px;
}
.project-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

.task-row-actions { display: flex; gap: 4px; flex-shrink: 0; }
.btn-task-action {
  width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--divider);
  background: rgba(0,0,0,0.2); color: var(--text); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s; font-size: 0.85rem;
}
.btn-task-action.play:hover { background: var(--primary); color: #1e1e2e; border-color: var(--primary); }
.btn-task-action.done:hover { background: var(--success); color: #1e1e2e; border-color: var(--success); }
.btn-task-action:disabled { opacity: 0.35; cursor: not-allowed; }

/* Schedule period items */
.period-item {
  display: flex; align-items: stretch; gap: 8px; padding: 12px;
  border: 1px solid var(--divider); border-radius: 14px;
  margin-bottom: 8px; background: rgba(0,0,0,0.15);
  transition: border-color 0.2s, box-shadow 0.2s;
}
.period-item:hover { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary-glow) inset; }
.period-item.is-active { border-color: var(--success); box-shadow: 0 0 12px rgba(166,227,161,.15); }
.period-time {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-width: 72px; font-weight: 700; font-size: 0.82rem; color: var(--primary); gap: 2px;
}
.period-time .sep { font-size: 0.6rem; color: var(--text-dim); }
.period-info { flex: 1; min-width: 0; }
.period-actions { display: flex; flex-direction: column; gap: 4px; justify-content: center; }

/* Task assignment */
.task-dropzone {
  min-height: 44px; border: 2px dashed var(--divider);
  border-radius: 10px; padding: 6px 10px; margin-top: 8px;
  display: flex; flex-wrap: wrap; align-items: center; gap: 4px;
  transition: border-color 0.2s, background 0.2s;
}
.task-dropzone.drag-over { border-color: var(--primary); background: var(--primary-glow); }
.task-dropzone .placeholder { color: var(--text-dim); font-size: 0.8rem; font-style: italic; }

.task-chip {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 10px; border-radius: 20px; font-size: 0.78rem;
  background: rgba(0,0,0,0.25); border: 1px solid var(--divider);
  margin: 2px; cursor: grab;
  --chip-color: var(--primary);
}
.task-chip:hover { border-color: var(--chip-color); }
.task-chip.is-done { opacity: 0.5; text-decoration: line-through; }
.task-chip .remove { cursor: pointer; opacity: 0.6; }
.task-chip .remove:hover { opacity: 1; color: var(--danger); }

.available-tasks {
  max-height: 280px; overflow-y: auto; padding: 8px;
  border: 1px solid var(--divider); border-radius: 12px;
  background: rgba(0,0,0,0.15);
}
.available-task {
  padding: 8px 12px; border-radius: 8px; cursor: grab;
  font-size: 0.85rem; margin-bottom: 4px;
  background: rgba(0,0,0,0.15); transition: background 0.15s;
  display: flex; align-items: center; gap: 6px;
}
.available-task:hover { background: rgba(255,255,255,0.05); }
.available-task.is-subtask { margin-left: 16px; font-size: 0.8rem; opacity: 0.9; border-left: 2px solid var(--divider); padding-left: 10px; }

.project-group { margin-bottom: 12px; }
.project-header {
  font-size: 0.72rem; font-weight: 700; text-transform: uppercase;
  color: var(--text-dim); margin-bottom: 6px;
  display: flex; align-items: center; gap: 6px;
}

.search-box {
  width: 100%; padding: 8px 12px; border-radius: 10px;
  border: 1px solid var(--divider); background: rgba(0,0,0,0.2);
  color: var(--text); margin-bottom: 10px; font-size: 0.85rem;
}

.task-section-header {
  display: flex; align-items: center; gap: 8px;
  margin: 16px 0 8px; cursor: pointer; user-select: none;
}
.task-count {
  font-size: 0.72rem; padding: 2px 8px; border-radius: 10px;
  background: var(--divider); font-weight: 700;
}
.task-section-today .task-count { background: var(--success); color: #1e1e2e; }

/* Template */
.day-tabs { display: flex; gap: 4px; margin-bottom: 12px; flex-wrap: wrap; }
.day-tab {
  flex: 1; min-width: 40px; text-align: center; padding: 6px 4px; border-radius: 8px;
  cursor: pointer; font-size: 0.78rem; font-weight: 600;
  background: rgba(0,0,0,0.2); border: 1px solid var(--divider);
  color: var(--text-dim); transition: all 0.2s;
}
.day-tab.active { background: var(--primary); color: #1e1e2e; border-color: var(--primary); }

.badge {
  font-size: 0.68rem; padding: 2px 8px; border-radius: 10px;
  background: var(--primary); color: #1e1e2e; font-weight: 700;
}
.badge-accent { background: var(--success); }
.text-muted { color: var(--text-dim); font-size: 0.85rem; }
.empty-state { text-align: center; padding: 36px 16px; color: var(--text-dim); }
.empty-state .icon { font-size: 2.5rem; margin-bottom: 10px; }
.flex-between { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.mt { margin-top: 8px; }
.mb { margin-bottom: 8px; }

#save-status {
  position: fixed; bottom: 12px; right: 12px; font-size: 0.7rem;
  padding: 6px 12px; border-radius: 8px;
  background: rgba(0,0,0,0.6); backdrop-filter: blur(8px);
  color: var(--text-dim); pointer-events: none; opacity: 0;
  transition: opacity 0.3s; display: flex; align-items: center; gap: 6px; z-index: 1000;
}
#save-status.active { opacity: 1; }
.spinner {
  width: 10px; height: 10px; border: 2px solid var(--text-dim);
  border-top-color: transparent; border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.modal-overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.75); display: none; align-items: center;
  justify-content: center; z-index: 2000; padding: 20px;
  backdrop-filter: blur(4px);
}
.modal-content {
  background: var(--bg); border: 1px solid var(--divider);
  border-radius: 20px; width: 100%; max-width: 420px;
  padding: 24px; box-shadow: 0 10px 40px rgba(0,0,0,0.5);
}
.modal-footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; flex-wrap: wrap; }

.scope-options { display: flex; flex-direction: column; gap: 8px; margin: 16px 0; }
.scope-option {
  padding: 12px 14px; border-radius: 12px; border: 2px solid var(--divider);
  cursor: pointer; transition: all 0.15s; background: rgba(0,0,0,0.15);
}
.scope-option:hover { border-color: var(--primary); }
.scope-option.selected { border-color: var(--primary); background: var(--primary-glow); }
.scope-option strong { display: block; margin-bottom: 2px; }
.scope-option span { font-size: 0.82rem; color: var(--text-dim); }

::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-thumb { background: var(--divider); border-radius: 3px; }
</style>
</head>
<body>
<div class="glass-bg"></div>
<div id="save-status"></div>

<h1>⏰ Periods Manager</h1>

<div class="date-selector" id="date-selector">
  <button class="date-btn active" onclick="setDateToday()">📅 Aujourd'hui</button>
  <button class="date-btn" onclick="setDateTomorrow()">➡️ Demain</button>
  <input type="date" id="custom-date" style="width:auto; min-width:140px; font-size:0.82rem;" onchange="setDateCustom(this.value)" />
  <span class="date-label" id="date-label"></span>
</div>

<div class="tabs">
  <button class="tab-btn active" data-tab="daily" onclick="switchTab('daily')">Daily View</button>
  <button class="tab-btn" data-tab="schedule" onclick="switchTab('schedule')">Schedule</button>
  <button class="tab-btn" data-tab="template" onclick="switchTab('template')">Template</button>
</div>

<!-- Daily View -->
<div id="daily" class="tab-panel active">
  <div class="timeline-sticky">
    <div id="daily-timeline"></div>
  </div>
  <div id="daily-scroll" class="daily-scroll"></div>
</div>

<!-- Schedule -->
<div id="schedule" class="tab-panel">
  <div id="schedule-content"></div>
</div>

<!-- Template -->
<div id="template" class="tab-panel">
  <div id="template-list"></div>
  <div id="template-editor" style="display:none"></div>
</div>

<!-- Modal: Period -->
<div id="modal-period" class="modal-overlay">
  <div class="modal-content">
    <h2 id="m-period-title">Ajouter une période</h2>
    <div id="scope-selector" class="scope-options" style="display:none">
      <div class="scope-option selected" data-scope="today" onclick="selectScope('today')">
        <strong>📅 Uniquement ce jour</strong>
        <span>Modification ponctuelle, ne modifie pas le template.</span>
      </div>
      <div class="scope-option" data-scope="template" onclick="selectScope('template')">
        <strong>📋 Template actif</strong>
        <span id="scope-template-name">Sera répété chaque semaine pour ce jour.</span>
      </div>
    </div>
    <div class="form-row"><label>Titre</label><input type="text" id="p-title" placeholder="Deep Work" style="flex:1" /></div>
    <div class="form-row"><label>Début</label><input type="time" id="p-start" /></div>
    <div class="form-row"><label>Fin</label><input type="time" id="p-end" /></div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closePeriodModal()">Annuler</button>
      <button class="btn btn-primary" onclick="savePeriod()">Enregistrer</button>
    </div>
  </div>
</div>

<!-- Modal: Template -->
<div id="modal-tt" class="modal-overlay">
  <div class="modal-content">
    <h2>Nouveau template</h2>
    <div class="form-row"><label>Nom</label><input type="text" id="m-tt-name" placeholder="Semaine cours" style="flex:1" /></div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeTTModal()">Annuler</button>
      <button class="btn btn-primary" onclick="createTimetable()">Créer</button>
    </div>
  </div>
</div>

<script>
// ── State ────────────────────────────────────────────────────────────────────
var DATA_VERSION = 2;
var data = { version: 2, deviceId: null, activeTimetableId: null, timetables: {}, dailyOverrides: {}, syncLog: [] };
var allTasks = [];
var allProjects = [];
var currentTaskId = null;
var currentPlanningDate = null;
var editingTimetableId = null;
var editingDayIndex = 0;
var modalPeriodIdx = null;
var modalTTPeriodIdx = null;
var modalContext = 'schedule'; // schedule | template
var periodSaveScope = 'today';
var taskSearchQuery = '';
var allTasksSectionCollapsed = false;
var draggedTaskId = null;
var DAYS = ['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
var saveTimeout = null;
var isSaving = false;
var needsSave = false;
var dailyScrollInitialized = false;

// ── Date helpers ─────────────────────────────────────────────────────────────
function planningDateStr() {
  var d = currentPlanningDate || new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function todayStr() {
  var d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function tomorrowStr() {
  var d = new Date(); d.setDate(d.getDate()+1);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function dayIndex(d) { return (d.getDay() + 6) % 7; }
function parseTime(s) { var p = s.split(':'); return parseInt(p[0],10)*60 + parseInt(p[1],10); }
function fmtTime(mins) { return String(Math.floor(mins/60)).padStart(2,'0') + ':' + String(mins%60).padStart(2,'0'); }
function uid() { return Date.now().toString(36) + Math.random().toString(36).substr(2,6); }
function escHtml(s) { if (!s) return ''; var t = document.createElement('div'); t.textContent = s; return t.innerHTML; }
function escAttr(s) { if (!s) return ''; return String(s).replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

function formatDateLabel(dateStr) {
  if (dateStr === todayStr()) return "Aujourd'hui — " + dateStr;
  if (dateStr === tomorrowStr()) return 'Demain — ' + dateStr;
  var d = new Date(dateStr + 'T12:00:00');
  var names = ['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
  return names[d.getDay()] + ' — ' + dateStr;
}

function setDateToday() { currentPlanningDate = new Date(); document.getElementById('custom-date').value = ''; updateDateSelector(); refreshCurrentTab(); dailyScrollInitialized = false; }
function setDateTomorrow() { var d = new Date(); d.setDate(d.getDate()+1); currentPlanningDate = d; document.getElementById('custom-date').value = ''; updateDateSelector(); refreshCurrentTab(); dailyScrollInitialized = false; }
function setDateCustom(val) { if (!val) return; currentPlanningDate = new Date(val+'T12:00:00'); updateDateSelector(); refreshCurrentTab(); dailyScrollInitialized = false; }

function updateDateSelector() {
  var ds = planningDateStr(), today = todayStr(), tomorrow = tomorrowStr();
  document.querySelectorAll('.date-btn').forEach(function(b, i) {
    b.classList.toggle('active', (i === 0 && ds === today) || (i === 1 && ds === tomorrow));
  });
  document.getElementById('date-label').textContent = formatDateLabel(ds);
  if (ds !== today && ds !== tomorrow) document.getElementById('custom-date').value = ds;
}

// ── Sync log & persistence ───────────────────────────────────────────────────
function loadDeviceId() {
  try {
    var stored = localStorage.getItem('pm_deviceId');
    if (stored) data.deviceId = stored;
  } catch(e) {}
  if (!data.deviceId) {
    data.deviceId = 'dev_' + uid();
    try { localStorage.setItem('pm_deviceId', data.deviceId); } catch(e) {}
  }
}

function recordOp(op, payload) {
  if (!data.syncLog) data.syncLog = [];
  var entry = { id: uid(), ts: Date.now(), deviceId: data.deviceId, op: op, payload: JSON.parse(JSON.stringify(payload)) };
  data.syncLog.push(entry);
  if (data.syncLog.length > 800) data.syncLog = data.syncLog.slice(-600);
  return entry;
}

function applyOpEntry(entry) {
  var p = entry.payload || {};
  switch (entry.op) {
    case 'MIGRATE_SNAPSHOT':
      data.activeTimetableId = p.activeTimetableId || null;
      data.timetables = p.timetables || {};
      data.dailyOverrides = p.dailyOverrides || {};
      break;
    case 'SET_ACTIVE_TIMETABLE':
      data.activeTimetableId = p.id;
      break;
    case 'CLEAR_ACTIVE_TIMETABLE':
      data.activeTimetableId = null;
      break;
    case 'UPSERT_TIMETABLE':
      data.timetables[p.id] = p.timetable;
      break;
    case 'DELETE_TIMETABLE':
      delete data.timetables[p.id];
      if (data.activeTimetableId === p.id) data.activeTimetableId = null;
      break;
    case 'SET_TEMPLATE_DAY_PERIODS':
      if (!data.timetables[p.templateId]) break;
      if (!data.timetables[p.templateId].days) data.timetables[p.templateId].days = {};
      data.timetables[p.templateId].days[p.dayIndex] = { periods: p.periods };
      break;
    case 'SET_DAILY_PERIODS':
      if (!data.dailyOverrides) data.dailyOverrides = {};
      data.dailyOverrides[p.dateStr] = { periods: p.periods };
      break;
    case 'DELETE_DAILY_OVERRIDE':
      if (data.dailyOverrides) delete data.dailyOverrides[p.dateStr];
      break;
  }
}

function mutate(op, payload) {
  applyOpEntry({ op: op, payload: payload });
  recordOp(op, payload);
  saveData();
}

function migrateData(parsed) {
  if (!parsed) parsed = {};
  if (!parsed.timetables) parsed.timetables = {};
  if (!parsed.dailyOverrides) parsed.dailyOverrides = {};
  if (!parsed.syncLog) parsed.syncLog = [];
  loadDeviceId();
  parsed.deviceId = parsed.deviceId || data.deviceId;
  parsed.version = DATA_VERSION;
  if (parsed.syncLog.length === 0 && (Object.keys(parsed.timetables).length || Object.keys(parsed.dailyOverrides).length)) {
    parsed.syncLog.push({
      id: uid(), ts: Date.now(), deviceId: parsed.deviceId,
      op: 'MIGRATE_SNAPSHOT',
      payload: {
        activeTimetableId: parsed.activeTimetableId,
        timetables: parsed.timetables,
        dailyOverrides: parsed.dailyOverrides
      }
    });
  }
  return parsed;
}

function mergeRemoteData(remote) {
  if (!remote || !remote.syncLog || !remote.syncLog.length) return false;
  var known = {};
  (data.syncLog || []).forEach(function(e) { known[e.id] = true; });
  var newOps = remote.syncLog.filter(function(e) { return !known[e.id]; });
  if (!newOps.length) return false;
  newOps.sort(function(a,b) { return a.ts - b.ts; });
  newOps.forEach(function(entry) {
    applyOpEntry(entry);
    data.syncLog.push(entry);
  });
  data.syncLog.sort(function(a,b) { return a.ts - b.ts; });
  return true;
}

async function executeSave() {
  if (isSaving) { needsSave = true; return; }
  isSaving = true; needsSave = false;
  showSaveStatus('Sauvegarde…', true);
  try {
    data.version = DATA_VERSION;
    await PluginAPI.persistDataSynced(JSON.stringify(data));
    showSaveStatus('Sauvegardé ✓', false);
  } catch(e) {
    console.error('Save failed:', e);
    showSaveStatus('Nouvelle tentative…', true);
    needsSave = true;
  }
  setTimeout(function() { isSaving = false; if (needsSave) executeSave(); }, 1100);
}

function saveData() {
  showSaveStatus('Sauvegarde…', true);
  if (saveTimeout) clearTimeout(saveTimeout);
  saveTimeout = setTimeout(executeSave, 200);
}

function showSaveStatus(text, spinning) {
  var el = document.getElementById('save-status');
  el.innerHTML = (spinning ? '<div class="spinner"></div>' : '') + '<span>' + text + '</span>';
  el.classList.add('active');
  if (!spinning) setTimeout(function() { el.classList.remove('active'); }, 2000);
}

async function loadDataFromStore() {
  try {
    var raw = await PluginAPI.loadSyncedData();
    if (raw) data = migrateData(JSON.parse(raw));
  } catch(e) { console.error('Load failed:', e); migrateData(data); }
}

async function loadTasks() {
  try {
    allTasks = await PluginAPI.getTasks();
    if (PluginAPI.getAllProjects) allProjects = await PluginAPI.getAllProjects();
  } catch(e) { allTasks = []; allProjects = []; }
}

// ── Period data access ───────────────────────────────────────────────────────
function getEffectivePeriodsForDate(dateStr) {
  if (data.dailyOverrides && data.dailyOverrides[dateStr]) return (data.dailyOverrides[dateStr].periods || []).slice();
  if (data.activeTimetableId && data.timetables[data.activeTimetableId]) {
    var tt = data.timetables[data.activeTimetableId];
    var d = new Date(dateStr + 'T12:00:00');
    var dow = dayIndex(d);
    if (tt.days && tt.days[dow] && tt.days[dow].periods) return tt.days[dow].periods.slice();
  }
  return [];
}

function getEffectivePeriods() { return getEffectivePeriodsForDate(planningDateStr()); }
function isDateOverridden(dateStr) { return !!(data.dailyOverrides && data.dailyOverrides[dateStr]); }

function setDailyPeriods(dateStr, periods) {
  mutate('SET_DAILY_PERIODS', { dateStr: dateStr, periods: periods });
}

function setTemplateDayPeriods(templateId, dayIndex, periods) {
  mutate('SET_TEMPLATE_DAY_PERIODS', { templateId: templateId, dayIndex: dayIndex, periods: periods });
}

function getProjectColor(projectId) {
  var p = allProjects.find(function(x) { return x.id === projectId; });
  return (p && p.theme && p.theme.primary) ? p.theme.primary : '#89b4fa';
}

function getTaskProjectId(task) {
  if (!task) return null;
  if (task.projectId) return task.projectId;
  if (task.parentId) {
    var parent = allTasks.find(function(t) { return t.id === task.parentId; });
    return parent ? parent.projectId : null;
  }
  return null;
}

function getProjectName(projectId) {
  if (!projectId) return 'Inbox';
  var p = allProjects.find(function(x) { return x.id === projectId; });
  return p ? p.title : 'Inbox';
}

function getTaskById(id) { return allTasks.find(function(t) { return t.id === id; }); }

function resolvePeriodTasks(period) {
  var result = [];
  if (!period || !period.taskIds) return result;
  period.taskIds.forEach(function(tid) {
    var t = getTaskById(tid);
    if (t) result.push(t);
  });
  return result;
}

function findCurrentPeriodIndex(periods, nowMins) {
  for (var i = 0; i < periods.length; i++) {
    var s = parseTime(periods[i].startTime);
    var e = parseTime(periods[i].endTime);
    if (nowMins >= s && nowMins < e) return i;
  }
  return -1;
}

// ── Task actions (SP integration) ────────────────────────────────────────────
async function startTask(taskId) {
  if (!taskId || typeof PluginAPI === 'undefined') return;
  PluginAPI.dispatchAction({ type: '[Task] SetCurrentTask', id: taskId });
  currentTaskId = taskId;
  refreshCurrentTab();
}

async function completeTask(taskId) {
  if (!taskId || typeof PluginAPI === 'undefined') return;
  try {
    await PluginAPI.updateTask(taskId, { isDone: true });
    allTasks = await PluginAPI.getTasks();
    refreshCurrentTab();
  } catch(e) { console.error('Complete failed', e); }
}

// ── Tabs ─────────────────────────────────────────────────────────────────────
function switchTab(tabId) {
  editingTimetableId = null;
  modalPeriodIdx = null;
  document.querySelectorAll('.tab-btn').forEach(function(b) {
    b.classList.toggle('active', b.getAttribute('data-tab') === tabId);
  });
  document.querySelectorAll('.tab-panel').forEach(function(p) {
    p.classList.toggle('active', p.id === tabId);
  });
  document.getElementById('template-list').style.display = 'block';
  document.getElementById('template-editor').style.display = 'none';
  if (tabId === 'daily') { dailyScrollInitialized = false; renderDailyView(); }
  else if (tabId === 'schedule') renderSchedule();
  else if (tabId === 'template') renderTemplateList();
}

function refreshCurrentTab() {
  var active = document.querySelector('.tab-panel.active');
  if (!active) return;
  if (active.id === 'daily') renderDailyView();
  else if (active.id === 'schedule') renderSchedule();
  else if (active.id === 'template') {
    if (editingTimetableId) renderTemplateEditor();
    else renderTemplateList();
  }
}

// ── Daily View ───────────────────────────────────────────────────────────────
function renderDailyTimeline(periods, nowMins, isToday) {
  var html = '<div class="timeline">';
  if (isToday) html += '<div class="timeline-now" style="left:' + (nowMins/14.4) + '%"></div>';
  var currentIdx = isToday ? findCurrentPeriodIndex(periods, nowMins) : -1;
  for (var i = 0; i < periods.length; i++) {
    var p = periods[i];
    var start = parseTime(p.startTime) / 14.4;
    var width = (parseTime(p.endTime) / 14.4) - start;
    var cls = i === currentIdx ? ' is-current' : '';
    html += '<div class="timeline-block'+cls+'" style="left:'+start+'%;width:'+width+'%;background:var(--primary)" title="'+escAttr(p.title)+'">'+escHtml(p.title)+'</div>';
  }
  html += '</div><div class="timeline-labels"><span>00:00</span><span>06:00</span><span>12:00</span><span>18:00</span><span>23:59</span></div>';
  return html;
}

function renderDailyTaskRow(task, isSubtask) {
  if (!task) return '';
  var pid = getTaskProjectId(task);
  var color = getProjectColor(pid);
  var pname = getProjectName(pid);
  var done = task.isDone;
  var running = currentTaskId === task.id;
  var html = '<div class="daily-task-row'+(done?' is-done':'')+(isSubtask?' is-subtask':'')+(running?' is-running':'')+'" style="--step-color:'+color+'">';
  html += '<div class="task-info"><div class="task-title-text">'+(isSubtask?'↳ ':'')+escHtml(task.title)+'</div>';
  html += '<div class="task-project-label"><span class="project-dot" style="background:'+color+'"></span>'+escHtml(pname)+'</div></div>';
  html += '<div class="task-row-actions">';
  html += '<button class="btn-task-action play" title="Lancer" '+(done?'disabled':'')+' onclick="startTask(\''+task.id+'\')">▶</button>';
  html += '<button class="btn-task-action done" title="Valider" '+(done?'disabled':'')+' onclick="completeTask(\''+task.id+'\')">✓</button>';
  html += '</div></div>';

  if (!isSubtask && task.subTaskIds && task.subTaskIds.length) {
    task.subTaskIds.forEach(function(sid) {
      var sub = getTaskById(sid);
      if (sub && !sub.isDone) html += renderDailyTaskRow(sub, true);
    });
  }
  return html;
}

function renderPeriodSection(period, idx, status, nowMins) {
  var tasks = resolvePeriodTasks(period);
  var html = '<div class="period-section is-'+status+'" id="period-section-'+idx+'">';
  html += '<div class="period-header"><div>';
  html += '<div class="period-time-badge">'+period.startTime+' — '+period.endTime+'</div>';
  html += '<div class="period-title-row">'+escHtml(period.title);
  if (status === 'current') html += ' <span class="badge badge-accent">MAINTENANT</span>';
  html += '</div></div></div>';

  if (tasks.length === 0) {
    html += '<p class="text-muted" style="padding:8px 0">Aucune tâche assignée.</p>';
  } else {
    tasks.forEach(function(t) { html += renderDailyTaskRow(t, !!t.parentId); });
  }
  html += '</div>';
  return html;
}

function renderDailyView() {
  var ds = planningDateStr();
  var isToday = ds === todayStr();
  var periods = getEffectivePeriods();
  periods.sort(function(a,b) { return parseTime(a.startTime) - parseTime(b.startTime); });

  var now = new Date();
  var nowMins = isToday ? now.getHours()*60 + now.getMinutes() : -1;
  var currentIdx = isToday ? findCurrentPeriodIndex(periods, nowMins) : -1;

  document.getElementById('daily-timeline').innerHTML = renderDailyTimeline(periods, nowMins, isToday);

  var scrollHtml = '';
  if (periods.length === 0) {
    scrollHtml = '<div class="empty-state"><div class="icon">📅</div><p>Aucune période pour '+formatDateLabel(ds)+'.</p><p class="text-muted mt">Créez-en dans l\'onglet Schedule.</p></div>';
  } else {
    var pastHtml = '', currentHtml = '', futureHtml = '';
    for (var i = 0; i < periods.length; i++) {
      var status = i < currentIdx ? 'past' : (i === currentIdx ? 'current' : 'future');
      var section = renderPeriodSection(periods[i], i, status, nowMins);
      if (status === 'past') pastHtml += section;
      else if (status === 'current') currentHtml += section;
      else futureHtml += section;
    }

    if (isToday && currentIdx === -1) {
      currentHtml = '<div class="break-message" id="period-break"><div class="icon">☕</div><strong>Pause</strong><p class="text-muted mt">Vous n\'êtes dans aucune période planifiée pour le moment.</p></div>';
    }

    scrollHtml = pastHtml + currentHtml + futureHtml;
  }

  document.getElementById('daily-scroll').innerHTML = scrollHtml;

  if (!dailyScrollInitialized) {
    dailyScrollInitialized = true;
    setTimeout(function() {
      var target = document.getElementById('period-section-'+currentIdx) || document.getElementById('period-break');
      if (target) target.scrollIntoView({ block: 'center', behavior: 'smooth' });
    }, 100);
  }
}

// ── Schedule (periods + assignment) ───────────────────────────────────────────
function renderSchedule() {
  var container = document.getElementById('schedule-content');
  var ds = planningDateStr();
  var periods = getEffectivePeriods();
  var overridden = isDateOverridden(ds);
  var currentTT = data.activeTimetableId ? data.timetables[data.activeTimetableId] : null;
  var isToday = ds === todayStr();
  periods.sort(function(a,b) { return parseTime(a.startTime) - parseTime(b.startTime); });

  var html = '<div class="flex-between mb"><h2>Planning — '+formatDateLabel(ds)+'</h2>';
  html += '<button class="btn btn-primary" onclick="openAddPeriodModal(\'schedule\')">+ Période</button></div>';

  html += '<div class="card" style="padding:12px 16px; border-left:4px solid '+(overridden?'var(--warning)':'var(--success)')+'">';
  if (overridden) {
    html += '<div class="flex-between"><span><strong>Mode :</strong> Override du jour</span>';
    html += '<button class="btn btn-sm" onclick="resetDateToTemplate()">Revenir au template</button></div>';
  } else if (currentTT) {
    html += '<span><strong>Template actif :</strong> <em>'+escHtml(currentTT.name)+'</em></span>';
  } else {
    html += '<span class="text-muted">Aucun template actif. Les périodes seront enregistrées pour ce jour uniquement.</span>';
  }
  html += '</div>';

  if (periods.length === 0) {
    html += '<div class="empty-state"><div class="icon">📭</div><p>Aucune période. Ajoutez-en une ci-dessus.</p></div>';
  } else {
    var nowMins = isToday ? new Date().getHours()*60 + new Date().getMinutes() : -1;
    for (var i = 0; i < periods.length; i++) {
      var p = periods[i];
      var start = parseTime(p.startTime), end = parseTime(p.endTime);
      var isActive = isToday && nowMins >= start && nowMins < end;
      html += '<div class="card period-item'+(isActive?' is-active':'')+'" style="padding:14px">';
      html += '<div class="flex-between mb"><div class="period-time" style="flex-direction:row; gap:8px; min-width:auto"><span>'+p.startTime+'</span><span class="sep">→</span><span>'+p.endTime+'</span></div>';
      html += '<div><strong>'+escHtml(p.title)+'</strong>'+(isActive?' <span class="badge badge-accent">NOW</span>':'')+'</div>';
      html += '<div style="display:flex;gap:4px"><button class="btn btn-sm btn-icon" onclick="openEditPeriodModal('+i+',\'schedule\')">✏️</button>';
      html += '<button class="btn btn-sm btn-icon btn-danger" onclick="deletePeriod('+i+')">🗑️</button></div></div>';

      html += '<div class="task-dropzone" ondragover="onDragOver(event)" ondrop="onDrop(event,'+i+')" ondragleave="onDragLeave(event)">';
      if (p.taskIds && p.taskIds.length) {
        p.taskIds.forEach(function(tid) {
          var t = getTaskById(tid);
          if (t) {
            var col = getProjectColor(getTaskProjectId(t));
            html += '<span class="task-chip'+(t.isDone?' is-done':'')+'" style="--chip-color:'+col+'" draggable="true" ondragstart="onTaskChipDragStart(event,\''+tid+'\')">';
            html += escHtml(t.title.substring(0,30))+'<span class="remove" onclick="removeTaskFromPeriod('+i+',\''+tid+'\')">×</span></span>';
          }
        });
      } else {
        html += '<span class="placeholder">Glissez des tâches ici…</span>';
      }
      html += '</div></div>';
    }
  }

  html += renderTaskPicker();
  container.innerHTML = html;
  if (taskSearchQuery) {
    var s = document.getElementById('task-search');
    if (s) { s.focus(); s.setSelectionRange(s.value.length, s.value.length); }
  }
}

function renderTaskPicker() {
  var ds = planningDateStr();
  var query = taskSearchQuery.toLowerCase();
  var parentTasks = allTasks.filter(function(t) { return !t.isDone && !t.parentId; });
  var subtasksByParent = {};
  allTasks.filter(function(t) { return !t.isDone && t.parentId; }).forEach(function(t) {
    if (!subtasksByParent[t.parentId]) subtasksByParent[t.parentId] = [];
    subtasksByParent[t.parentId].push(t);
  });

  var todayTasks = parentTasks.filter(function(t) { return t.dueDay === ds; });
  var otherTasks = parentTasks.filter(function(t) { return t.dueDay !== ds; });
  if (query) {
    todayTasks = todayTasks.filter(function(t) {
      if (t.title.toLowerCase().indexOf(query) !== -1) return true;
      return (subtasksByParent[t.id]||[]).some(function(s) { return s.title.toLowerCase().indexOf(query)!==-1; });
    });
    otherTasks = otherTasks.filter(function(t) {
      if (t.title.toLowerCase().indexOf(query) !== -1) return true;
      return (subtasksByParent[t.id]||[]).some(function(s) { return s.title.toLowerCase().indexOf(query)!==-1; });
    });
  }

  function renderTaskList(tasks) {
    var h = '';
    var groups = {};
    tasks.forEach(function(t) {
      var pid = getTaskProjectId(t) || 'inbox';
      if (!groups[pid]) groups[pid] = [];
      groups[pid].push(t);
    });
    Object.keys(groups).sort().forEach(function(pid) {
      var color = getProjectColor(pid === 'inbox' ? null : pid);
      var pname = getProjectName(pid === 'inbox' ? null : pid);
      h += '<div class="project-group"><div class="project-header"><span class="project-dot" style="background:'+color+'"></span>'+escHtml(pname)+'</div>';
      groups[pid].forEach(function(t) {
        h += '<div class="available-task" draggable="true" ondragstart="onTaskDragStart(event,\''+t.id+'\')">⠿ '+escHtml(t.title.substring(0,60))+'</div>';
        (subtasksByParent[t.id]||[]).forEach(function(sub) {
          if (!query || sub.title.toLowerCase().indexOf(query)!==-1)
            h += '<div class="available-task is-subtask" draggable="true" ondragstart="onTaskDragStart(event,\''+sub.id+'\')">↳ '+escHtml(sub.title.substring(0,55))+'</div>';
        });
      });
      h += '</div>';
    });
    return h || '<p class="text-muted" style="text-align:center;padding:10px">Aucune tâche.</p>';
  }

  var html = '<div class="mt"><h3>Tâches disponibles</h3>';
  html += '<input type="search" class="search-box" id="task-search" placeholder="Rechercher…" oninput="onTaskSearch(this.value)" value="'+escAttr(taskSearchQuery)+'" />';
  html += '<div class="task-section-today"><div class="task-section-header"><h3>📌 '+formatDateLabel(ds)+'</h3><span class="task-count">'+todayTasks.length+'</span></div>';
  html += '<div class="available-tasks">'+renderTaskList(todayTasks)+'</div></div>';
  html += '<div class="task-section-all"><div class="task-section-header" onclick="toggleAllTasksSection()">';
  html += '<span style="font-size:0.7rem">'+(allTasksSectionCollapsed?'▸':'▾')+'</span>';
  html += '<h3>📂 Toutes les tâches</h3><span class="task-count">'+otherTasks.length+'</span></div>';
  html += '<div class="available-tasks" id="all-tasks-list" style="'+(allTasksSectionCollapsed?'display:none':'')+'">'+renderTaskList(otherTasks)+'</div></div></div>';
  return html;
}

function resetDateToTemplate() {
  var ds = planningDateStr();
  mutate('DELETE_DAILY_OVERRIDE', { dateStr: ds });
  refreshCurrentTab();
}

// ── Period modals ────────────────────────────────────────────────────────────
function selectScope(scope) {
  periodSaveScope = scope;
  document.querySelectorAll('.scope-option').forEach(function(el) {
    el.classList.toggle('selected', el.getAttribute('data-scope') === scope);
  });
}

function openAddPeriodModal(context) {
  modalContext = context || 'schedule';
  modalPeriodIdx = null;
  document.getElementById('m-period-title').textContent = 'Ajouter une période';
  document.getElementById('p-title').value = '';
  document.getElementById('p-start').value = '08:00';
  document.getElementById('p-end').value = '09:00';

  var scopeEl = document.getElementById('scope-selector');
  if (modalContext === 'schedule' && data.activeTimetableId && data.timetables[data.activeTimetableId]) {
    scopeEl.style.display = 'flex';
    periodSaveScope = 'today';
    selectScope('today');
    document.getElementById('scope-template-name').textContent =
      'Template « '+data.timetables[data.activeTimetableId].name+' » — '+DAYS[dayIndex(currentPlanningDate || new Date())];
  } else {
    scopeEl.style.display = 'none';
    periodSaveScope = modalContext === 'template' ? 'template' : 'today';
  }
  document.getElementById('modal-period').style.display = 'flex';
}

function openEditPeriodModal(idx, context) {
  modalContext = context || 'schedule';
  modalPeriodIdx = idx;
  periodSaveScope = 'today';
  document.getElementById('scope-selector').style.display = 'none';
  var p = getEffectivePeriods()[idx];
  document.getElementById('m-period-title').textContent = 'Modifier la période';
  document.getElementById('p-title').value = p.title;
  document.getElementById('p-start').value = p.startTime;
  document.getElementById('p-end').value = p.endTime;
  document.getElementById('modal-period').style.display = 'flex';
}

function closePeriodModal() { document.getElementById('modal-period').style.display = 'none'; }

function savePeriodToTarget(periods, idx, newPeriod) {
  if (idx === null) periods.push(newPeriod);
  else { newPeriod.taskIds = periods[idx].taskIds || []; periods[idx] = newPeriod; }
  periods.sort(function(a,b) { return parseTime(a.startTime) - parseTime(b.startTime); });
  return periods;
}

function savePeriod() {
  if (editingTimetableId && modalContext === 'template') { saveTTPeriodActual(); return; }

  var title = document.getElementById('p-title').value.trim();
  var start = document.getElementById('p-start').value;
  var end = document.getElementById('p-end').value;
  if (!title || !start || !end) return;

  var newP = { title: title, startTime: start, endTime: end, taskIds: [] };

  if (modalContext === 'template' && editingTimetableId) {
    var ps = (data.timetables[editingTimetableId].days[editingDayIndex].periods || []).slice();
    savePeriodToTarget(ps, modalTTPeriodIdx, newP);
    setTemplateDayPeriods(editingTimetableId, editingDayIndex, ps);
    closePeriodModal();
    renderTemplateEditor();
    return;
  }

  if (periodSaveScope === 'template' && data.activeTimetableId) {
    var ds = planningDateStr();
    var dow = dayIndex(new Date(ds + 'T12:00:00'));
    var tps = (data.timetables[data.activeTimetableId].days[dow] && data.timetables[data.activeTimetableId].days[dow].periods)
      ? data.timetables[data.activeTimetableId].days[dow].periods.slice() : [];
    savePeriodToTarget(tps, modalPeriodIdx, newP);
    setTemplateDayPeriods(data.activeTimetableId, dow, tps);
  } else {
    var dateStr = planningDateStr();
    var dps = getEffectivePeriodsForDate(dateStr);
    if (!isDateOverridden(dateStr)) dps = dps.slice();
    savePeriodToTarget(dps, modalPeriodIdx, newP);
    setDailyPeriods(dateStr, dps);
  }

  closePeriodModal();
  refreshCurrentTab();
}

function deletePeriod(idx) {
  var dateStr = planningDateStr();
  var ps = getEffectivePeriodsForDate(dateStr);
  if (!isDateOverridden(dateStr)) ps = ps.slice();
  ps.splice(idx, 1);
  setDailyPeriods(dateStr, ps);
  refreshCurrentTab();
}

// ── Drag & drop ──────────────────────────────────────────────────────────────
function onTaskSearch(val) { taskSearchQuery = val; renderSchedule(); }
function toggleAllTasksSection() {
  allTasksSectionCollapsed = !allTasksSectionCollapsed;
  renderSchedule();
}
function onTaskDragStart(ev, id) { draggedTaskId = id; ev.dataTransfer.setData('text/plain', id); }
function onTaskChipDragStart(ev, id) { draggedTaskId = id; ev.dataTransfer.setData('text/plain', id); }
function onDragOver(ev) { ev.preventDefault(); ev.currentTarget.classList.add('drag-over'); }
function onDragLeave(ev) { ev.currentTarget.classList.remove('drag-over'); }
function onDrop(ev, idx) {
  ev.preventDefault(); ev.currentTarget.classList.remove('drag-over');
  var id = ev.dataTransfer.getData('text/plain') || draggedTaskId;
  if (!id && PluginAPI.getDraggedTaskId) id = PluginAPI.getDraggedTaskId();
  if (!id) return;
  var dateStr = planningDateStr();
  var ps = getEffectivePeriodsForDate(dateStr);
  if (!isDateOverridden(dateStr)) ps = ps.slice();
  for (var i = 0; i < ps.length; i++) {
    if (ps[i].taskIds) ps[i].taskIds = ps[i].taskIds.filter(function(t) { return t !== id; });
  }
  if (!ps[idx].taskIds) ps[idx].taskIds = [];
  if (ps[idx].taskIds.indexOf(id) === -1) ps[idx].taskIds.push(id);
  setDailyPeriods(dateStr, ps);
  refreshCurrentTab();
}
function removeTaskFromPeriod(idx, id) {
  var dateStr = planningDateStr();
  var ps = getEffectivePeriodsForDate(dateStr);
  if (!isDateOverridden(dateStr)) ps = ps.slice();
  if (ps[idx] && ps[idx].taskIds) {
    ps[idx].taskIds = ps[idx].taskIds.filter(function(t) { return t !== id; });
    setDailyPeriods(dateStr, ps);
    refreshCurrentTab();
  }
}

// ── Template management ────────────────────────────────────────────────────────
function renderTemplateList() {
  var container = document.getElementById('template-list');
  var html = '<div class="flex-between mb"><h2>Templates hebdomadaires</h2>';
  html += '<button class="btn btn-primary" onclick="openCreateTimetableModal()">+ Nouveau</button></div>';
  var ids = Object.keys(data.timetables);
  if (!ids.length) {
    html += '<div class="empty-state"><div class="icon">📋</div><p>Aucun template. Créez votre semaine type.</p></div>';
  } else {
    ids.forEach(function(id) {
      var tt = data.timetables[id];
      var isActive = data.activeTimetableId === id;
      var total = 0;
      for (var d = 0; d < 7; d++) if (tt.days && tt.days[d] && tt.days[d].periods) total += tt.days[d].periods.length;
      html += '<div class="card"><div class="flex-between"><div><strong>'+escHtml(tt.name)+'</strong><br><span class="text-muted">'+total+' périodes</span>';
      if (isActive) html += ' <span class="badge badge-accent">ACTIF</span>';
      html += '</div><div style="display:flex;flex-direction:column;gap:4px">';
      if (isActive) html += '<button class="btn btn-sm" onclick="deactivateTimetable()">Désactiver</button>';
      else html += '<button class="btn btn-sm btn-primary" onclick="activateTimetable(\''+id+'\')">Activer</button>';
      html += '<div style="display:flex;gap:4px"><button class="btn btn-sm btn-icon" onclick="editTimetable(\''+id+'\')">✏️</button>';
      html += '<button class="btn btn-sm btn-icon btn-danger" onclick="deleteTimetable(\''+id+'\')">🗑️</button></div></div></div></div>';
    });
  }
  container.innerHTML = html;
}

function openCreateTimetableModal() {
  document.getElementById('m-tt-name').value = 'Semaine type';
  document.getElementById('modal-tt').style.display = 'flex';
}
function closeTTModal() { document.getElementById('modal-tt').style.display = 'none'; }

function createTimetable() {
  var name = document.getElementById('m-tt-name').value.trim();
  if (!name) return;
  var id = uid();
  var tt = { name: name, days: {} };
  for (var d = 0; d < 7; d++) tt.days[d] = { periods: [] };
  mutate('UPSERT_TIMETABLE', { id: id, timetable: tt });
  closeTTModal();
  editTimetable(id);
}

function activateTimetable(id) {
  mutate('SET_ACTIVE_TIMETABLE', { id: id });
  var ds = planningDateStr();
  if (data.dailyOverrides && data.dailyOverrides[ds]) mutate('DELETE_DAILY_OVERRIDE', { dateStr: ds });
  renderTemplateList();
  refreshCurrentTab();
}

function deactivateTimetable() {
  mutate('CLEAR_ACTIVE_TIMETABLE', {});
  renderTemplateList();
  refreshCurrentTab();
}

function deleteTimetable(id) {
  mutate('DELETE_TIMETABLE', { id: id });
  renderTemplateList();
}

function editTimetable(id) {
  editingTimetableId = id;
  editingDayIndex = dayIndex(currentPlanningDate || new Date());
  document.getElementById('template-list').style.display = 'none';
  document.getElementById('template-editor').style.display = 'block';
  renderTemplateEditor();
}

function closeTimetableEditor() {
  editingTimetableId = null;
  document.getElementById('template-editor').style.display = 'none';
  document.getElementById('template-list').style.display = 'block';
  renderTemplateList();
}

function renderTemplateEditor() {
  var container = document.getElementById('template-editor');
  var tt = data.timetables[editingTimetableId];
  if (!tt) { closeTimetableEditor(); return; }

  var html = '<div class="flex-between mb"><h2>'+escHtml(tt.name)+'</h2><button class="btn" onclick="closeTimetableEditor()">← Retour</button></div>';
  html += '<div class="day-tabs">';
  for (var d = 0; d < 7; d++) {
    html += '<div class="day-tab'+(d===editingDayIndex?' active':'')+'" onclick="editingDayIndex='+d+';renderTemplateEditor()">'+DAYS[d]+'</div>';
  }
  html += '</div>';
  html += '<div class="flex-between mb"><h3>'+DAYS[editingDayIndex]+'</h3>';
  html += '<button class="btn btn-primary btn-sm" onclick="addTTPeriod()">+ Période</button></div>';

  var dayData = tt.days[editingDayIndex] || { periods: [] };
  if (!dayData.periods.length) {
    html += '<p class="text-muted" style="text-align:center;padding:20px">Aucune période ce jour-là.</p>';
  } else {
    dayData.periods.forEach(function(p, i) {
      html += '<div class="period-item"><div class="period-time"><span>'+p.startTime+'</span><span class="sep">▼</span><span>'+p.endTime+'</span></div>';
      html += '<div class="period-info"><strong>'+escHtml(p.title)+'</strong></div>';
      html += '<div class="period-actions"><button class="btn btn-sm btn-icon" onclick="editTTPeriod('+i+')">✏️</button>';
      html += '<button class="btn btn-sm btn-icon btn-danger" onclick="deleteTTPeriod('+i+')">🗑️</button></div></div>';
    });
  }
  container.innerHTML = html;
}

function addTTPeriod() {
  modalContext = 'template';
  modalTTPeriodIdx = null;
  document.getElementById('scope-selector').style.display = 'none';
  document.getElementById('m-period-title').textContent = 'Période template';
  document.getElementById('p-title').value = '';
  document.getElementById('p-start').value = '08:00';
  document.getElementById('p-end').value = '09:00';
  document.getElementById('modal-period').style.display = 'flex';
}

function editTTPeriod(idx) {
  modalContext = 'template';
  modalTTPeriodIdx = idx;
  document.getElementById('scope-selector').style.display = 'none';
  var p = data.timetables[editingTimetableId].days[editingDayIndex].periods[idx];
  document.getElementById('m-period-title').textContent = 'Modifier période template';
  document.getElementById('p-title').value = p.title;
  document.getElementById('p-start').value = p.startTime;
  document.getElementById('p-end').value = p.endTime;
  document.getElementById('modal-period').style.display = 'flex';
}

function deleteTTPeriod(idx) {
  var ps = data.timetables[editingTimetableId].days[editingDayIndex].periods.slice();
  ps.splice(idx, 1);
  setTemplateDayPeriods(editingTimetableId, editingDayIndex, ps);
  renderTemplateEditor();
}

function saveTTPeriodActual() {
  var title = document.getElementById('p-title').value.trim();
  var start = document.getElementById('p-start').value;
  var end = document.getElementById('p-end').value;
  if (!title || !start || !end) return;
  var ps = (data.timetables[editingTimetableId].days[editingDayIndex].periods || []).slice();
  var np = { title: title, startTime: start, endTime: end, taskIds: [] };
  if (modalTTPeriodIdx === null) ps.push(np);
  else { np.taskIds = ps[modalTTPeriodIdx].taskIds || []; ps[modalTTPeriodIdx] = np; }
  ps.sort(function(a,b) { return parseTime(a.startTime) - parseTime(b.startTime); });
  setTemplateDayPeriods(editingTimetableId, editingDayIndex, ps);
  closePeriodModal();
  renderTemplateEditor();
}

// ── Init ─────────────────────────────────────────────────────────────────────
async function init() {
  if (typeof PluginAPI === 'undefined') { setTimeout(init, 100); return; }
  currentPlanningDate = new Date();
  loadDeviceId();
  await loadDataFromStore();
  await loadTasks();
  updateDateSelector();
  renderDailyView();

  if (PluginAPI.registerHook) {
    PluginAPI.registerHook(PluginAPI.Hooks.PERSISTED_DATA_UPDATE, async function(p) {
      if (!p || !p.data) return;
      try {
        var remote = JSON.parse(p.data);
        if (mergeRemoteData(remote)) {
          await loadTasks();
          saveData();
          refreshCurrentTab();
        }
      } catch(e) { console.error('Sync merge failed', e); }
    });

    PluginAPI.registerHook(PluginAPI.Hooks.CURRENT_TASK_CHANGE, function(p) {
      currentTaskId = p && p.task ? p.task.id : null;
      if (document.getElementById('daily').classList.contains('active')) renderDailyView();
    });
  }

  window.addEventListener('message', function(e) {
    if (e.data && e.data.type === 'SP_ACTION') {
      var action = e.data.action;
      if (action && action.type === '[Task] SetCurrentTask') currentTaskId = action.id;
      if (document.getElementById('daily').classList.contains('active')) renderDailyView();
    }
  });

  setInterval(function() {
    if (document.getElementById('daily').classList.contains('active') && planningDateStr() === todayStr()) {
      renderDailyView();
    }
  }, 60000);
}

init();
</script>
